<!DOCTYPE html>
<html lang="th" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      /* Vintage Sketch Studio style (references/style-spec.md). Fonts (SIL OFL): Chonburi (Thai headlines), Trirong 400/700 (Thai prop text),
         Playfair Display 700/900 (Latin labels, Roman numerals), Special Elite (Latin notes). Host + cards = torn paper with a boiling edge (3 frames @ 8 fps). */
      @font-face { font-family: "Chonburi"; font-display: block; src: url("assets/fonts/Chonburi-Regular.ttf") format("truetype"); }
      @font-face { font-family: "Trirong"; font-weight: 400; font-display: block; src: url("assets/fonts/Trirong-Regular.ttf") format("truetype"); }
      @font-face { font-family: "Trirong"; font-weight: 700; font-display: block; src: url("assets/fonts/Trirong-Bold.ttf") format("truetype"); }
      @font-face { font-family: "Playfair"; font-weight: 700; font-display: block; src: url("assets/fonts/PlayfairDisplay-Bold.ttf") format("truetype"); }
      @font-face { font-family: "Playfair"; font-weight: 900; font-display: block; src: url("assets/fonts/PlayfairDisplay-Black.ttf") format("truetype"); }
      @font-face { font-family: "Special Elite"; font-display: block; src: url("assets/fonts/SpecialElite-Regular.ttf") format("truetype"); }

      :root { --paper: #EFE4CC; --paper2: #D8C39B; --ink: #3A2A1E; --soft: #7A5C43; --sang: #A8432A; --sang2: #C4673F; --gold: #B08A3E; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--paper); font-family: "Trirong", serif; color: var(--ink); }
      .full { position: absolute; inset: 0; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene > .inner { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
      .cam { position: absolute; inset: 0; transform-origin: 50% 45%; }

      /* paper backgrounds: light centre, darker aged edges; .dk = dimmer page for the sombre part */
      .pg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, #F4EBD6 0%, #EFE4CC 55%, #D8C39B 100%); }
      .pg.dk { background: radial-gradient(ellipse at 50% 45%, #E6D7B6 0%, #D6C096 55%, #B39B6C 100%); }
      .bd { position: absolute; mix-blend-mode: multiply; pointer-events: none; }
      .scrib { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; opacity: .5; }

      /* type */
      .tz { position: absolute; left: 100px; right: 130px; top: 290px; height: 400px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; }
      .h { font-family: "Chonburi", serif; font-size: 110px; line-height: 1.2; color: var(--ink); white-space: nowrap; text-shadow: 0 4px 0 rgba(90,60,30,.12); }
      .h.xl { font-size: 128px; } .h.m { font-size: 92px; } .h.sm { font-size: 76px; }
      .r { color: var(--sang); }
      .s { font-family: "Trirong", serif; font-weight: 700; font-size: 54px; line-height: 1.35; color: var(--soft); white-space: nowrap; }
      .lab { font-family: "Playfair", serif; font-weight: 700; font-size: 36px; letter-spacing: .24em; color: var(--soft); white-space: nowrap; }
      .num { font-family: "Playfair", serif; font-weight: 900; }
      .se { font-family: "Special Elite", monospace; color: var(--soft); white-space: nowrap; }
      .w { display: inline-block; opacity: 0; }
      .sw { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
      .rule { display: flex; align-items: center; gap: 16px; justify-content: center; margin: 8px auto 14px; }
      .rule i { height: 3px; width: 190px; background: var(--ink); opacity: .8; } .rule b { width: 16px; height: 16px; background: var(--gold); border: 2px solid var(--ink); transform: rotate(45deg); }

      /* torn-paper card: 3 boil frames under the content. Size = content + 60px pad each side */
      .tc { position: absolute; opacity: 0; }
      .tc > img { position: absolute; inset: 0; width: 100%; height: 100%; }
      .tc > .ct { position: absolute; inset: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      .tt { font-family: "Trirong", serif; font-weight: 700; color: var(--ink); white-space: nowrap; line-height: 1.3; }
      /* boil: #root[data-f] steps 0,1,2 at 8 fps; every boil set has .b0 .b1 .b2 */
      .b1, .b2 { visibility: hidden; }
      #root[data-f="1"] .b0, #root[data-f="2"] .b0 { visibility: hidden; }
      #root[data-f="1"] .b1, #root[data-f="2"] .b2 { visibility: visible; }

      /* host: torn-paper statue sticker, lower 42% */
      .host { position: absolute; top: 1100px; width: 860px; height: 860px; transform-origin: 50% 100%; }
      .host.L { left: -170px; } .host.R { left: 390px; } .host.C { left: 110px; }
      .host .br { position: absolute; inset: 0; transform-origin: 50% 100%; }
      .host .pz { position: absolute; inset: 0; opacity: 0; }
      .host .pz.m { transform: scaleX(-1); }
      .host img { position: absolute; inset: 0; width: 860px; height: 860px; }

      /* sketch props (inline SVG, sepia line, wobble filter) */
      .svg { position: absolute; opacity: 0; }
      .svg svg { width: 100%; height: 100%; display: block; overflow: visible; }
      .ink { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .chalk { fill: none; stroke: var(--sang); stroke-linecap: round; stroke-linejoin: round; }
      .seal { position: absolute; width: 170px; height: 170px; border-radius: 50%; opacity: 0; background: radial-gradient(circle at 38% 35%, #C4673F, #A8432A 55%, #7E2E1C);
        display: flex; align-items: center; justify-content: center; box-shadow: 4px 6px 0 rgba(80,30,15,.3);
        clip-path: polygon(50% 0,63% 4%,78% 3%,86% 14%,97% 22%,96% 38%,100% 52%,95% 66%,97% 80%,84% 88%,74% 98%,58% 96%,45% 100%,31% 95%,17% 97%,10% 84%,2% 74%,4% 58%,0 44%,5% 30%,3% 16%,16% 9%,28% 2%); }
      .seal span { width: 72%; height: 72%; border-radius: 50%; border: 3px solid rgba(243,217,196,.6); display: flex; align-items: center; justify-content: center; color: #F3D9C4; font-family: "Chonburi", serif; font-size: 44px; white-space: nowrap; }
      .tape { position: absolute; width: 150px; height: 44px; background: rgba(222,205,160,.8); box-shadow: 0 1px 0 rgba(0,0,0,.08); opacity: 0; }

      /* overlays */
      #fiber { pointer-events: none; mix-blend-mode: multiply; opacity: .5; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='500' height='500'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .55 0 0 0 0 .45 0 0 0 0 .3 0 0 0 .55 0'/></filter><rect width='500' height='500' filter='url(%23n)'/></svg>"); }
      #blot { pointer-events: none; mix-blend-mode: multiply; opacity: .32; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='1920'><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='.004' numOctaves='3' seed='9'/><feColorMatrix values='0 0 0 0 .6 0 0 0 0 .45 0 0 0 0 .25 0 0 0 1.2 -.45'/></filter><rect width='1080' height='1920' filter='url(%23b)'/></svg>"); }
      #burnedge { pointer-events: none; box-shadow: inset 0 0 160px 40px rgba(110,72,36,.55), inset 0 0 30px 6px rgba(70,40,20,.5); }
      #flash { position: absolute; inset: 0; background: #FBF6EA; opacity: 0; }
      #sepia { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, #6b4a2e, #2e1f14); opacity: 0; }
      #grain { pointer-events: none; overflow: hidden; }
      @keyframes gr { 0%,100%{transform:translate(0,0)} 25%{transform:translate(-4%,3%)} 50%{transform:translate(3%,-4%)} 75%{transform:translate(-2%,-3%)} }
      #grain i { position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; opacity: .16; mix-blend-mode: multiply;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .3 0 0 0 0 .2 0 0 0 0 .1 0 0 0 .6 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        animation: gr .5s steps(1) infinite; }
    
      .tc, .svg, .seal, .host .pz { opacity: 1; } .w { opacity: 1; }
      .v { display: none; } body.v1 .v1, body.v2 .v2 { display: block; }
      .big { font-family: "Chonburi", serif; font-size: 168px; line-height: 1.12; color: var(--ink); white-space: nowrap; text-shadow: 0 6px 0 rgba(90,60,30,.14); } .big.r { color: var(--sang); }
    </style>
  </head>
